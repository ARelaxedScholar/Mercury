[package]
name = "orichalcum-macros"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Experimental compiler-verified state-machine macros for Orichalcum."
license = "MIT"
repository = "https://github.com/ARelaxedScholar/Orichalcum"
readme = "README.md"
keywords = ["workflow", "state-machine", "proc-macro"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
orichalcum-definition = { version = "=0.5.0", path = "../orichalcum-definition" }
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }

[dev-dependencies]
trybuild = "1.0.116"
