[workspace]
members = [
    ".",
    "crates/orichalcum-definition",
    "crates/orichalcum-macros",
]
resolver = "2"

[package]
name = "orichalcum"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A type-safe, composable agent orchestration framework for building complex, multi-step workflows."
license = "MIT"
repository = "https://github.com/ARelaxedScholar/Orichalcum"
readme = "README.md"
keywords = ["llm", "agent", "workflow", "orchestration", "async"]
categories = ["asynchronous", "development-tools"]
exclude = ["/Cargo.nix", "/flake.lock", "/flake.nix"]

[package.metadata.cargo2nix]
cargo2nixVersion = "0.12.0"

[features]
default = []
llm = ["dep:reqwest", "dep:chrono"]
# Retained for compatibility; the in-memory telemetry API has no optional dependencies.
telemetry = []
experimental-graph = ["dep:orichalcum-macros"]

[dependencies]
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.16.0", features = ["v4"] }
orichalcum-macros = { version = "=0.5.0", path = "crates/orichalcum-macros", optional = true }

# Optional dependencies
chrono = { version = "0.4.38", features = ["serde"], optional = true }
reqwest = { version = "0.12.23", features = ["json"], optional = true }
async-trait = "0.1.89"
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["rt", "macros", "time"] }

[[example]]
name = "semantic_llm_flow"
required-features = ["llm"]
